name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compile and test
        run: mvn -B verify

      - name: Validate Docker Compose
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Docker runtime smoke test
        run: |
          set -euo pipefail

          cleanup() {
            docker compose down -v >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker compose up -d --build

          healthy=0
          for i in $(seq 1 60); do
            if curl --fail --silent http://localhost:8088/actuator/health >/tmp/health.json; then
              healthy=1
              break
            fi
            sleep 2
          done

          if [ "$healthy" -ne 1 ]; then
            echo "Application did not become healthy"
            docker compose logs --no-color --tail=300 postgres tte-signing || true
            exit 1
          fi

          docker compose exec -T postgres             psql -U tte -d tte -tAc             "SELECT to_regclass('public.issued_certificate') IS NOT NULL;"             | grep -q t

          docker compose exec -T postgres             psql -U tte -d tte -tAc             "SELECT to_regclass('public.tsa_serial_seq') IS NOT NULL;"             | grep -q t

          if ! curl --fail --show-error             -u admin:change-this-admin-password             -H "Content-Type: application/json"             -d '{
              "commonName":"CI Test Signer",
              "organization":"TTE Signing CI",
              "organizationalUnit":"Automated Test",
              "country":"ID",
              "email":"ci@example.test",
              "validityDays":30,
              "pkcs12Password":"ci-p12-password-12345"
            }'             http://localhost:8088/api/v1/certificates/issue             -o /tmp/ci-signer.p12; then
            docker compose logs --no-color --tail=300 postgres tte-signing || true
            exit 1
          fi

          openssl pkcs12             -in /tmp/ci-signer.p12             -passin pass:ci-p12-password-12345             -info -noout

          if ! curl --fail --show-error \
            -u admin:change-this-admin-password \
            -F document=@test-documents/test-document.pdf \
            -F pkcs12=@/tmp/ci-signer.p12 \
            -F password=ci-p12-password-12345 \
            -F level=T \
            http://localhost:8088/api/v1/signatures/pdf/sign \
            -o /tmp/ci-document-bt.pdf; then
            echo "PAdES B-T signing smoke test failed"
            docker compose logs --no-color --tail=400 postgres tte-signing || true
            exit 1
          fi

          test "$(head -c 4 /tmp/ci-document-bt.pdf)" = "%PDF"

          if ! curl --fail --show-error \
            -u admin:change-this-admin-password \
            -F document=@/tmp/ci-document-bt.pdf \
            http://localhost:8088/api/v1/signatures/pdf/validate \
            -o /tmp/ci-validation.xml; then
            echo "PAdES validation smoke test failed"
            docker compose logs --no-color --tail=400 postgres tte-signing || true
            exit 1
          fi

          test -s /tmp/ci-validation.xml

          if ! curl --fail --show-error \
            -u admin:change-this-admin-password \
            -F document=@/tmp/ci-document-bt.pdf \
            "http://localhost:8088/api/v1/signatures/pdf/extend?level=LT" \
            -o /tmp/ci-document-lt.pdf; then
            echo "PAdES B-LT extension smoke test failed"
            docker compose logs --no-color --tail=500 postgres tte-signing || true
            exit 1
          fi

          test "$(head -c 4 /tmp/ci-document-lt.pdf)" = "%PDF"

          if ! curl --fail --show-error \
            -u admin:change-this-admin-password \
            -F document=@/tmp/ci-document-lt.pdf \
            http://localhost:8088/api/v1/signatures/pdf/validate \
            -o /tmp/ci-validation-lt.xml; then
            echo "PAdES B-LT validation smoke test failed"
            docker compose logs --no-color --tail=500 postgres tte-signing || true
            exit 1
          fi

          test -s /tmp/ci-validation-lt.xml

          if ! curl --fail --show-error \
            -u admin:change-this-admin-password \
            -F document=@/tmp/ci-document-lt.pdf \
            "http://localhost:8088/api/v1/signatures/pdf/extend?level=LTA" \
            -o /tmp/ci-document-lta.pdf; then
            echo "PAdES B-LTA extension smoke test failed"
            docker compose logs --no-color --tail=500 postgres tte-signing || true
            exit 1
          fi

          test "$(head -c 4 /tmp/ci-document-lta.pdf)" = "%PDF"

          if ! curl --fail --show-error \
            -u admin:change-this-admin-password \
            -F document=@/tmp/ci-document-lta.pdf \
            http://localhost:8088/api/v1/signatures/pdf/validate \
            -o /tmp/ci-validation-lta.xml; then
            echo "PAdES B-LTA validation smoke test failed"
            docker compose logs --no-color --tail=500 postgres tte-signing || true
            exit 1
          fi

          test -s /tmp/ci-validation-lta.xml
